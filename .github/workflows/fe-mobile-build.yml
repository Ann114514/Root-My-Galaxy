name: FE Lab Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/fe-mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile experimental debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 cmake;3.22.1'
      - name: Set up NDK r28
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxy-FE-Lab-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
